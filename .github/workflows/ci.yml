name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "student/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build shared Docker environment
        run: docker build --tag aiss-club-check .

      - name: TypeScript, lint, and production build
        run: docker run --rm aiss-club-check npm run check

      - name: Audit production dependencies
        run: docker run --rm aiss-club-check npm audit --omit=dev --audit-level=high